[project]
name = "credit-risk-scoring"
version = "0.1.0"
description = "Application scoring: PD at origination, scorecard champion, XGBoost challenger, cost-based decision."
readme = "README.md"
requires-python = ">=3.11,<3.12"
authors = [{ name = "Mamadou Kane" }]

# Core: everything needed to train, evaluate and serve the model.
dependencies = [
    "pandas>=2.2",
    "numpy>=1.26",
    "pyarrow>=16",
    "pyyaml>=6",
    "scikit-learn>=1.5",
    "optbinning>=0.20",
    "xgboost>=2.1",
    "shap>=0.46",
    "mlflow>=2.16",
    "matplotlib>=3.9",
    "seaborn>=0.13",
    "fastapi>=0.115",
    "uvicorn>=0.30",
    "pydantic>=2.8",
]

[project.optional-dependencies]
# Dev: tests, lint, notebooks and the data download.
dev = [
    "pytest>=8",
    "httpx>=0.27",
    "ruff>=0.6",
    "ipykernel>=6.29",
    "nbconvert>=7.16",
    "kaggle>=1.6",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/credit_risk"]

[tool.pytest.ini_options]
testpaths = ["tests"]
markers = [
    "data: needs the real Kaggle files in data/raw (skipped when they are missing, e.g. in CI)",
]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP"]
